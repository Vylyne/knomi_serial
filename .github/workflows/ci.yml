name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first one's results irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The check worth having most. The firmware's static_asserts pin the packet
  # layout, but only against other C++ - nothing else compares it with the
  # Python that has to produce those bytes. A field added to `struct State`
  # without a matching change to _STATE_FMT compiles clean, installs clean, and
  # produces a display reading every field from the wrong offset.
  protocol:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # knomi_serial.py imports pyserial at module scope, so importing the
      # module to test it needs pyserial present.
      - run: pip install -r requirements-dev.txt
      - name: Run every test
        run: |
          status=0
          for test in tests/test_*.py; do
            echo "== $test"
            python "$test" || status=1
          done
          exit $status

  lint:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  # One firmware. There used to be a second env that compiled out two pages,
  # which meant it was possible to break only the build nobody ran - the reason
  # this was a matrix. Which pages a screen carries is runtime config now.
  firmware:
    name: Build firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # scripts/version.py derives the build version from git describe, and
          # a shallow clone has no tags to describe against.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-
      - run: pip install platformio
      - run: pio run -e knomi
