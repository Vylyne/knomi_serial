[platformio]
boards_dir   = boards
default_envs = knomi

[env]
framework     = arduino
monitor_speed = 115200
extra_scripts = pre:scripts/version.py
build_flags   =
    -Wall
    -Isrc
    -DLV_CONF_INCLUDE_SIMPLE

lib_deps =
    SPI
    ; Pinned to a commit, not a tag: upstream ships 2.5.43 on master but never
    ; tagged it, and the newest tag (v2.5.33) is a downgrade from this.
    TFT_eSPI=https://github.com/Bodmer/TFT_eSPI#16e37595040eac69cd628e4bffb56fc30cad6299
    lvgl/lvgl@~9.5.0

[env:knomi]
platform               = espressif32
board                  = knomi
board_build.partitions = knomi_partitions.csv
board_upload.wait_for_upload_port = no
build_flags            =
    ${env.build_flags}
    -DKNOMI

monitor_filters = esp32_exception_decoder

; Bench build. Scans I2C at boot and reports over the same serial link, so the
; result shows up in scripts/simulate.py. Answers whether U6 shares the touch
; panel's bus, and whether the LIS2DW12 footprint is populated.
[env:knomi_i2cscan]
extends     = env:knomi
build_flags =
    ${env:knomi.build_flags}
    -DI2C_SCAN=1

[env:knomi_toolchanger]
extends         = env:knomi
build_flags     =
    ${env:knomi.build_flags}
    -DTOOLCHANGER=1

monitor_filters = esp32_exception_decoder